name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_title:
        description: 'Release Title'
        required: false
        default: 'MetroTune Update'
      release_notes:
        description: 'Release Notes'
        required: false
        default: 'Automated release build.'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Keystore & Permissions
        run: |
          chmod +x gradlew
          touch .env
          if [ -f debug.keystore.base64 ]; then
            echo "Decoding debug keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            echo "Generating debug keystore with keytool..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Rename APK for Release
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/*.apk release-output/MetroTune-${{ github.ref_name || 'latest' }}.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MetroTune-apk
          path: release-output/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-output/*.apk
          name: ${{ github.event.inputs.release_title || github.ref_name }}
          body: ${{ github.event.inputs.release_notes || 'Release build for MetroTune Android application.' }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
